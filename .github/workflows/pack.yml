on:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML nbtlib

      - name: 获取版本号
        id: get_version
        run: |
          VERSION=$(python -c "import yaml; print(yaml.safe_load(open('defines.yml'))['VERSION'])")
          TAG="v${TAG}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: 设置标签和后缀
        id: set_tag
        run: |
          TAG="${{ env.TAG }}"
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          echo "short_hash=$SHORT_HASH" >> $GITHUB_OUTPUT
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "hotfix_suffix=-hotfix-$SHORT_HASH" >> $GITHUB_OUTPUT
            echo "is_hotfix=true" >> $GITHUB_OUTPUT
          else
            echo "hotfix_suffix=" >> $GITHUB_OUTPUT
            echo "is_hotfix=false" >> $GITHUB_OUTPUT
          fi

      - name: 设置资产名称
        id: set_asset_name
        run: |
          VERSION="${{ env.VERSION }}"
          SUFFIX="${{ steps.set_tag.outputs.hotfix_suffix }}"
          echo "asset_datapack=HunterGame-${VERSION}${SUFFIX}.zip" >> $GITHUB_OUTPUT

      - name: 打包数据包
        run: python pack.py --data --no-compat

      - name: 重命名产物
        run: |
          mv "output/HunterGame-Data-${{ env.VERSION }}-generic.zip" "output/${{ steps.set_asset_name.outputs.asset_datapack }}"

      - name: 创建/更新 Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "output/${{ steps.set_asset_name.outputs.asset_datapack }}"
          tag: ${{ env.TAG }}
          name: "HunterGame ${{ env.VERSION }}"
          body: |
            ## HuntGame ${{ env.VERSION }}

            **触发方式**: ${{ github.event_name == 'schedule' && '每日定时构建' || '手动触发' }}
            **提交**: [${{ steps.set_tag.outputs.short_hash }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            > ⚠️ **注意**: 此为每日自动构建的预发布版本，未经充分测试，不保证可用性。

            ### 📦 下载
            | 文件 | 说明 |
            |------|------|
            | `HunterGame-${{ env.VERSION }}.zip` | HunterGame 数据包，放入 `saves/<存档>/datapacks/` 即可 |

            ### 🎮 游戏规则
            - 1 名猎物 vs 其余猎人
            - 猎物击杀末影龙获胜，被杀则猎人获胜
          prerelease: true
          allowUpdates: true
          updateOnlyUnreleased: false
          makeLatest: ${{ steps.set_tag.outputs.is_hotfix == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}